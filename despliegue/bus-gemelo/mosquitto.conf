# Bus del gemelo (red del gemelo). Lo usan todos los servicios del gemelo (GDB-DIS, DD-04).
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 100000
# Telegraf confirma cada mensaje al escribirlo en InfluxDB: sin este margen, a la velocidad
# máxima se acumularían mensajes pendientes.
max_inflight_messages 1000
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
