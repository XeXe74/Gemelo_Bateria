# Telegraf: escribe en InfluxDB lo que circula por el bus del gemelo (GDB-DIS, DD-15)
# y mide la CPU y la memoria de cada contenedor (DD-14). Las credenciales llegan del .env.

[agent]
  skip_processors_after_aggregators = false
  interval = "10s"
  flush_interval = "1s"
  omit_hostname = true

# Cada medida lleva la etiqueta «cubo», que decide en qué cubo se guarda.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "gemelo"
  bucket_tag = "cubo"
  exclude_bucket_tag = true

# 1. Lago de datos: copia sin modificar de cada mensaje del activo (REQ-0260).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gemelo/bruto/#"]
  qos = 1
  client_id = "telegraf-bruto"
  persistent_session = true
  username = "${BUS_USUARIO}"
  password = "${BUS_CLAVE}"
  topic_tag = "tema"
  data_format = "value"
  data_type = "string"
  name_override = "mensaje"
  [inputs.mqtt_consumer.tags]
    cubo = "bruto"

# 2. Señales numéricas, con su valor, calidad, coherencia y marca temporal simulada.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gemelo/PHONE1/#", "gemelo/CHARGER1/#"]
  qos = 1
  client_id = "telegraf-senales"
  persistent_session = true
  username = "${BUS_USUARIO}"
  password = "${BUS_CLAVE}"
  topic_tag = ""
  data_format = "json_v2"
  [inputs.mqtt_consumer.tags]
    cubo = "gemelo"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "senal"
    timestamp_path = "body.ts"
    timestamp_format = "2006-01-02T15:04:05.000Z"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "body.t"
      rename = "senal"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "body.v"
      rename = "v"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "body.q"
      rename = "q"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "body.k"
      rename = "k"
      type = "int"

# 3. Señales con un JSON como valor (calendario, decisiones y riesgo). Se reciben como texto y el
#    procesador de abajo guarda el valor entero como texto, con la marca temporal simulada.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gemelo/USER1/#", "gemelo/GD/#"]
  qos = 1
  client_id = "telegraf-json"
  persistent_session = true
  username = "${BUS_USUARIO}"
  password = "${BUS_CLAVE}"
  topic_tag = ""
  data_format = "value"
  data_type = "string"
  name_override = "senal_json"
  [inputs.mqtt_consumer.tags]
    cubo = "gemelo"

[[processors.starlark]]
  namepass = ["senal_json"]
  source = '''
load("json.star", "json")
load("time.star", "time")

def apply(metric):
    b = json.decode(metric.fields["value"])["body"]
    m = Metric("senal")
    m.tags["senal"] = b["t"]
    m.tags["cubo"] = metric.tags["cubo"]
    m.fields["valor"] = json.encode(b["v"])
    m.fields["q"] = int(b["q"])
    m.fields["k"] = int(b["k"])
    m.time = time.parse_time(b["ts"], format="2006-01-02T15:04:05.000Z", location="UTC").unix_nano
    return m
'''

# 4. Registro de auditoría (campos de syslog) y avisos, en el cubo «registro».
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gemelo/sistema/registro"]
  qos = 1
  client_id = "telegraf-registro"
  persistent_session = true
  username = "${BUS_USUARIO}"
  password = "${BUS_CLAVE}"
  topic_tag = ""
  data_format = "json_v2"
  [inputs.mqtt_consumer.tags]
    cubo = "registro"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "registro"
    timestamp_path = "instante"
    timestamp_format = "2006-01-02T15:04:05.000Z"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "servicio"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "gravedad"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "codigo_gravedad"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mensaje"
      type = "string"

# 5. Estado, latidos, conexión con el activo, control del sistema y notificaciones: como texto.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["gemelo/sistema/estado/#", "gemelo/sistema/latido/#", "gemelo/sistema/activo/#",
            "gemelo/sistema/simulacion", "gemelo/sistema/parada", "gemelo/notificaciones/#"]
  qos = 1
  client_id = "telegraf-sistema"
  persistent_session = true
  username = "${BUS_USUARIO}"
  password = "${BUS_CLAVE}"
  topic_tag = "tema"
  data_format = "value"
  data_type = "string"
  name_override = "sistema"
  [inputs.mqtt_consumer.tags]
    cubo = "registro"

# 6. Monitorización del propio gemelo: CPU y memoria de cada contenedor (REQ-0320).
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  perdevice_include = []
  total_include = ["cpu"]
  namepass = ["docker_container_cpu", "docker_container_mem", "docker_container_status"]
  fieldinclude = ["usage_percent", "usage", "limit", "max_usage", "container_id", "uptime_ns"]
  [inputs.docker.tags]
    cubo = "registro"
